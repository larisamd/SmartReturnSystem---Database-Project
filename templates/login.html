{% extends 'base.html' %}
{% block title %}Login | Smart Return{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="brand-mark">SR</div>
            <h2>Smart Return System</h2>
            <p>Secure product returns and complaint management</p>
        </div>

        <form method="post" class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" class="form-control" placeholder="name@company.com" required>
            </div>
            <div class="form-group mt-3">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button class="btn btn-primary w-100 mt-4" type="submit">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
